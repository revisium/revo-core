sonar.projectKey=revisium_revo-core
sonar.organization=revisium
sonar.projectName=revo-core
sonar.sourceEncoding=UTF-8

sonar.sources=src
sonar.tests=test
sonar.test.inclusions=test/**/*.ts
sonar.typescript.tsconfigPaths=tsconfig.json
sonar.javascript.lcov.reportPaths=coverage/lcov.info
sonar.coverage.exclusions=src/__generated__/**,src/**/*.module.ts,src/infrastructure/database/**,src/main.ts
sonar.exclusions=src/__generated__/**

# A parameterless CQRS query is intentionally represented by an empty message class.
sonar.issue.ignore.multicriteria=parameterlessQuery
sonar.issue.ignore.multicriteria.parameterlessQuery.ruleKey=typescript:S2094
sonar.issue.ignore.multicriteria.parameterlessQuery.resourceKey=src/features/system/queries/impl/get-system-info.query.ts
